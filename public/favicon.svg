<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- InformAluno: reconhecimento facial + escola -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado (tom institucional) -->
  <rect width="64" height="64" rx="14" fill="url(#fundo)"/>

  <!-- Cantos do leitor facial (escaneamento biométrico) -->
  <g fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
    <path d="M14 24v-5a5 5 0 0 1 5-5h5"/>
    <path d="M50 24v-5a5 5 0 0 0-5-5h-5"/>
    <path d="M14 40v5a5 5 0 0 0 5 5h5"/>
    <path d="M50 40v5a5 5 0 0 1-5 5h-5"/>
  </g>

  <!-- Rosto reconhecido: cabeça e ombros -->
  <circle cx="32" cy="31" r="7" fill="#ffffff"/>
  <path d="M20 48c1.7-6.2 6.4-9.6 12-9.6s10.3 3.4 12 9.6Z" fill="#ffffff"/>

  <!-- Capacete de formatura (identidade escolar) -->
  <path d="M32 17.5 41 22l-9 4.5L23 22Z" fill="#facc15"/>
</svg>
