name = "inform-aluno-api"
main = "src/index.ts"
compatibility_date = "2026-06-24"

# ============================================================
# DEPLOY EM PRODUÇÃO:
#   1) npx wrangler d1 create inform-aluno-db   (ja feito — id abaixo)
#   2) npx wrangler d1 execute inform-aluno-db --remote --file schema.sql
#   3) npm run deploy  (de inform-aluno-api)
#   4) npx wrangler secret put <NOME>  (RESEND_API_KEY, EMAIL_FROM,
#      APP_URL, CORS_ORIGINS — ver README)
# ============================================================

[[d1_databases]]
binding = "DB"
database_name = "inform-aluno-db"
database_id = "d3fb70bd-d4fe-4c5d-b721-445cf3878643"
